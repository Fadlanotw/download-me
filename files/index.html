<!DOCTYPE html>
<html>
<head>
  <title>Contoh JavaScript</title>
</head>
<body>
  <p id="paragraf">Teks awal</p>
  <button onclick="ubahTeks()">Ubah Teks</button>
  <script>
    function ubahTeks() {
      document.getElementById("paragraf").innerHTML = "Teks baru!";
    }
  </script>
</body>
</html>
