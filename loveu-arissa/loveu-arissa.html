<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Love You Arissa</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Quicksand:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg1:#ffe3ea; --bg2:#ffc2d1; --ink:#a3123f; --glow:rgba(255,255,255,.9); --soft:#7a2a45;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg1:#2a0f26; --bg2:#4a1636; --ink:#ff8fb1; --glow:rgba(255,143,177,.6); --soft:#f3c1d3;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg1:#2a0f26; --bg2:#4a1636; --ink:#ff8fb1; --glow:rgba(255,143,177,.6); --soft:#f3c1d3;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:radial-gradient(ellipse at 50% 40%,var(--bg2),var(--bg1) 75%);
  color:var(--ink);
  font-family:"Quicksand",system-ui,sans-serif;
  overflow:hidden;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}
main{
  height:100%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:24px;position:relative;z-index:2;
}
.small{
  font-size:clamp(1.2rem,5vw,1.6rem);
  color:var(--soft);
  margin:0 0 .2em;
  opacity:0;
  animation:in 1s .2s forwards;
}
h1{
  margin:0;
  font-family:"Great Vibes","Snell Roundhand","Brush Script MT",cursive;
  font-weight:400;
  font-size:clamp(4rem,22vw,9rem);
  line-height:1.05;
  text-shadow:0 0 24px var(--glow);
}
h1 span{
  display:inline-block;
  opacity:0;
  transform:translateY(18px) scale(.9);
  animation:letter .7s cubic-bezier(.2,.8,.3,1) forwards;
}
.heart{
  font-size:clamp(2.4rem,10vw,3.6rem);
  margin-top:.4em;
  display:inline-block;
  opacity:0;
  animation:in .6s 2.3s forwards, beat 1.3s 2.9s infinite;
}
.hint{
  position:fixed;left:0;right:0;
  bottom:calc(20px + env(safe-area-inset-bottom,0px));
  text-align:center;color:var(--soft);font-size:.95rem;opacity:0;
  animation:in 1s 3.2s forwards;z-index:2;
}
.fly{
  position:fixed;pointer-events:none;z-index:4;
  animation:rise var(--d,6s) linear forwards;
  opacity:.85;
}
button.heart{background:none;border:0;padding:0;color:inherit;cursor:pointer;font-family:inherit}
button.heart:focus-visible{outline:2px solid var(--ink);outline-offset:6px;border-radius:50%}
.msg{position:fixed;inset:0;z-index:3;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;background:rgba(30,5,20,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .4s}
.msg.open{opacity:1;pointer-events:auto}
.card{max-width:420px;width:100%;max-height:90vh;max-height:90dvh;overflow-y:auto;padding:40px 24px 32px;border-radius:28px;background:var(--bg1);border:2px solid var(--ink);box-shadow:0 0 40px var(--glow);transform:scale(.88);transition:transform .5s cubic-bezier(.2,.8,.3,1)}
.msg.open .card{transform:none}
.card h2{margin:0;font-family:"Great Vibes","Snell Roundhand","Brush Script MT",cursive;font-weight:400;font-size:clamp(2.8rem,14vw,4.6rem);line-height:1.1;color:var(--ink)}
.card p{margin:.8em 0 0;color:var(--soft);font-size:1.05rem;line-height:1.5}
.card .to{font-size:1.6rem;color:var(--ink)}
.galwrap{margin-top:1.6em}
.galwrap p{margin:0 0 .7em;font-size:.95rem}
.gallery{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;padding:0 4px 10px;margin:0 -8px}
.ph{flex:0 0 78%;margin:0;scroll-snap-align:center;aspect-ratio:3/4;border-radius:18px;overflow:hidden;border:2px solid var(--ink);box-shadow:0 0 18px var(--glow);background:var(--bg2)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.card .close{margin-top:1.4em;padding:.6em 1.8em;border-radius:999px;border:2px solid var(--ink);background:none;color:var(--ink);font:inherit;font-size:.95rem;cursor:pointer}
@keyframes in{to{opacity:1}}
@keyframes letter{to{opacity:1;transform:none}}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.25)}30%{transform:scale(1)}45%{transform:scale(1.18)}}
@keyframes rise{
  from{transform:translateY(0) rotate(0);opacity:.9}
  to{transform:translateY(-110vh) rotate(var(--r,20deg));opacity:0}
}
@media (prefers-reduced-motion: reduce){
  .small,.heart,.hint{animation:none;opacity:1}
  h1 span{animation:none;opacity:1;transform:none}
}
</style>
</head>
<body>
<main>
  <p class="small">untuk kamu</p>
  <h1 id="title" aria-label="Love You Arissa"></h1>
  <button class="heart" id="heartBtn" type="button" aria-label="Buka pesan">❤</button>
</main>
<div class="hint">ketuk hati untuk melihat pesan</div>
<div class="msg" id="msg" role="dialog" aria-live="polite">
  <div class="card">
    <h2>Happy 5th Monthversary</h2>
    <p class="to">Arissa ❤</p>
    <p>Sama aku terus ya sayang, sampai selamanya dan sampai dunia ini berhenti.</p>
    <div class="galwrap" id="galWrap" hidden>
      <p>Foto kita, geser untuk melihat</p>
      <div class="gallery" id="gallery"></div>
    </div>
    <button class="close" id="closeBtn" type="button">Tutup</button>
  </div>
</div>

<script>
(function(){
  var text="Love You Arissa";
  var h=document.getElementById("title");
  for(var i=0;i<text.length;i++){
    var s=document.createElement("span");
    s.textContent=text[i]===" "?"\u00a0":text[i];
    s.style.animationDelay=(0.5+i*0.11)+"s";
    h.appendChild(s);
  }
  var icons=["❤","💗","💖","💕"];
  function heart(x,y){
    var e=document.createElement("div");
    e.className="fly";
    e.textContent=icons[Math.floor(Math.random()*icons.length)];
    e.style.left=x+"px";
    e.style.top=y+"px";
    e.style.fontSize=(16+Math.random()*30)+"px";
    e.style.setProperty("--d",(4+Math.random()*4)+"s");
    e.style.setProperty("--r",(Math.random()*80-40)+"deg");
    document.body.appendChild(e);
    setTimeout(function(){e.remove()},8500);
  }
  function burst(x,y){
    for(var i=0;i<8;i++){
      heart(x+(Math.random()*80-40),y+(Math.random()*40-20));
    }
  }
  document.addEventListener("pointerdown",function(ev){burst(ev.clientX,ev.clientY)});
  var msg=document.getElementById("msg");
  document.getElementById("heartBtn").addEventListener("click",function(){
    msg.classList.add("open");
    for(var i=0;i<24;i++){
      heart(Math.random()*window.innerWidth,window.innerHeight*(0.5+Math.random()*0.5));
    }
  });
  msg.addEventListener("click",function(ev){if(ev.target===msg)msg.classList.remove("open")});
  document.getElementById("closeBtn").addEventListener("click",function(){msg.classList.remove("open")});
  var photos=["foto1.jpg","foto2.jpg","foto3.jpg","foto4.jpg","foto5.jpg"];
  var gal=document.getElementById("gallery");
  var galWrap=document.getElementById("galWrap");
  photos.forEach(function(src){
    var f=document.createElement("figure");
    f.className="ph";
    var im=new Image();
    im.alt="Foto kita";
    im.decoding="async";
    im.onload=function(){galWrap.hidden=false};
    im.onerror=function(){f.remove()};
    im.src=src;
    f.appendChild(im);
    gal.appendChild(f);
  });
  var reduce=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(!reduce){
    setInterval(function(){
      heart(Math.random()*window.innerWidth,window.innerHeight-10);
    },700);
  }
})();
</script>
</body>
</html>
