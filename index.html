<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>wavy.ai — Login</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>

  <main class="card">
    <div class="hero">
      <button class="hero__back" aria-label="Kembali">‹</button>
    </div>

    <div class="content">
      <div class="brand">
        <span class="brand__mark">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
            <path d="M2 14c2-3 4-3 6 0s4 3 6 0 4-3 6 0" stroke="#2f8fdc" stroke-width="2.4" stroke-linecap="round" fill="none"/>
          </svg>
        </span>
        wavy.ai
      </div>

      <h1>Login to your account</h1>

      <div class="social-row">
        <button class="btn-social" type="button" data-provider="google">
          <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.88 2.7-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.96v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.67 9c0-.59.1-1.16.28-1.7V4.97H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.03l2.99-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.46 3.44 1.34l2.58-2.58C13.46.9 11.43 0 9 0A9 9 0 0 0 .96 4.97l2.99 2.33C4.66 5.17 6.65 3.58 9 3.58z"/></svg>
          Google
        </button>
        <button class="btn-social" type="button" data-provider="facebook">
          <svg width="18" height="18" viewBox="0 0 18 18"><circle cx="9" cy="9" r="9" fill="#1877F2"/><path fill="#fff" d="M11.2 9.5h-1.4v5H8V9.5H7V7.9h1V6.9c0-1.1.5-2 2.2-2h1.4v1.6h-.9c-.6 0-.7.3-.7.6v1h1.6l-.2 1.4z"/></svg>
          Facebook
        </button>
      </div>

      <div class="divider"><span>Or</span></div>

      <form id="login-form">
        <input type="email" name="email" placeholder="Email" autocomplete="email" required />
        <input type="password" name="password" placeholder="Password" autocomplete="current-password" required />
        <p class="form-error" id="form-error"></p>
        <button type="submit" class="btn-login">Login</button>
      </form>

      <p class="hint">Coba akun demo: <strong>demo@wavy.ai</strong> / <strong>password123</strong></p>
    </div>
  </main>

  <div class="dots">
    <span class="is-active"></span>
    <span></span>
  </div>

  <script src="app.js"></script>
</body>
</html>
